services:
  postgres:
    image: postgres:16-alpine
    container_name: appointment-reminder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appointments
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointments"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
